<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#0A0F1E"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DD6D0"/>
      <stop offset="100%" stop-color="#4C7CF2"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Letter C as a thick open ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="46"
          stroke-linecap="round" stroke-dasharray="754 943" stroke-dashoffset="-152"
          transform="rotate(0 256 256)"/>

  <!-- Letter N, solid, centered, overlapping the C ring -->
  <g fill="#F4F7FF">
    <rect x="196" y="178" width="34" height="156" rx="8"/>
    <rect x="282" y="178" width="34" height="156" rx="8"/>
    <polygon points="196,178 230,178 316,304 316,334 282,334 196,208"/>
  </g>
</svg>
